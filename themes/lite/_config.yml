# Lite theme — minimal, CDN-only. Inspired by https://brentfitzgerald.com/
# 顶部导航自动发现：source/ 下带 index.* / README.* 的目录会出现在导航里。

# 首页简介，每项一段
bio:
  - "𝑾𝒖𝒙𝒉 (吴小红)，啥都干的开发。"
  - "前后端、运维、啥都会一点，前端领域更专业。"
  - "喜欢开源、分享，偶尔记录，这里写的都是些简单的。"

# 头像，图放 themes/lite/source/avatar/
avatar: avatar/avatar-photo-520.webp

# SEO / 分享默认值：文章 front-matter 没写的字段在这里兜底。
seo:
  # 留空则用站点 _config.yml 的 author
  default_author: ""
  # 分享图必须是 jpg/png，部分平台不解析 webp
  default_og_image: "/images/share.jpg"
  # 方图用 summary；换 1.91:1 大图后改 summary_large_image
  twitter_card: summary
  license_url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  robots_global: "index,follow,max-image-preview:large"
  site_locale: zh_CN

footer:
  since: 2018
  license: CC BY-NC-SA 4.0
  # 版权行用的站点短名；留空则用站点 _config.yml 的 author
  name: Wuxh

social:
  github: https://github.com/Wxh16144

# 侧边目录：标题数达到 min_items 才显示，groups 可按路径覆盖默认值
toc:
  enable: true
  min_depth: 2
  max_depth: 3
  min_items: 2
  groups:
    - paths:
        - notes/**
        - bookmarks/**

# CDN 资源：markdown 正文样式 + highlight.js 主题（跟随系统深浅色）
cdn:
  markdown_css: https://registry.npmmirror.com/github-markdown-css/5.9.0/files/github-markdown.css
  highlight_light: https://registry.npmmirror.com/highlight.js/11.12.0/files/styles/github.min.css
  highlight_dark: https://registry.npmmirror.com/highlight.js/11.12.0/files/styles/github-dark.min.css

  # 拉丁字体；中文由 scripts/font-subset.js 裁剪后自托管
  font:
    - https://registry.npmmirror.com/@lobehub/webfont-geist/1.0.0/files/css/index.css
    - https://registry.npmmirror.com/@lobehub/webfont-geist-mono/1.0.0/files/css/index.css
