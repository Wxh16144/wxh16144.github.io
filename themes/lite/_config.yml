# Lite theme
# A minimal, CDN-only theme inspired by https://brentfitzgerald.com/
# No comments / analytics / search / pjax / math — just posts + markdown + highlight.
#
# Top nav is auto-discovered (scripts/nav.js): any top-level source/ folder with
# an index.* or README.* at its root shows up automatically, no list to maintain.

# Short bio shown next to the post list on the home page, one paragraph per item
bio:
  - "𝑾𝒖𝒙𝒉(吴小红)，啥都干的开发。"
  - "前后端、运维、啥都会一点，前端领域更专业。"
  - "喜欢开源、分享，偶尔记录，这里写的都是些简单的。"

# Avatar shown above the bio (place the image at themes/lite/source/avatar/)
avatar: avatar/avatar-cartoon-520.webp

# 站点级 SEO / 分享默认值 —— 文章 front-matter 没写的字段全部在这里兜底。
# 写作时只需在需要覆盖的 md 里写对应字段，其余留空即可。
seo:
  # 文章没写 author 时兜底；再留空则退回站点根 _config.yml 的 author
  default_author: ""
  # 文章没写 cover 时的分享兜底图。留空 = 不做图片兜底（og:image 只在有 cover 时输出）。
  # 想要启用：放一张 1200x630 的 jpg/png 到 themes/lite/source/images/default-share.jpg
  # （不要用 webp，Twitter 不支持），然后把值改成 "/images/default-share.jpg"。
  default_og_image: ""
  # 全站统一版权链接，文章不需要重复写 license
  license_url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  # 单篇可用 front-matter robots 覆盖；留空这里默认
  robots_global: "index,follow,max-image-preview:large"
  site_locale: zh_CN

footer:
  since: 2018
  license: CC BY-NC-SA 4.0

social:
  github: https://github.com/Wxh16144

# Sidebar TOC. min_depth/max_depth/min_items below are the defaults applied
# everywhere (posts included) once a page has enough headings. `groups` lets
# specific paths override those defaults if they ever need different settings.
toc:
  enable: true
  min_depth: 2
  max_depth: 3
  min_items: 2
  groups:
    - paths:
        - notes/**
        - bookmarks/**

# CDN resources — markdown body style + highlight.js theme (light/dark switch via prefers-color-scheme)
cdn:
  markdown_css: https://registry.npmmirror.com/github-markdown-css/5.9.0/files/github-markdown.css
  highlight_light: https://registry.npmmirror.com/highlight.js/11.12.0/files/styles/github.min.css
  highlight_dark: https://registry.npmmirror.com/highlight.js/11.12.0/files/styles/github-dark.min.css

  # 正文字体。留空 = 系统字体栈
  font:
    - https://registry.npmmirror.com/@lobehub/webfont-geist/1.0.0/files/css/index.css
    - https://registry.npmmirror.com/@lobehub/webfont-geist-mono/1.0.0/files/css/index.css
    - https://registry.npmmirror.com/@lobehub/webfont-harmony-sans-sc/1.0.0/files/css/index.css
