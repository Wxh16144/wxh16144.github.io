name: Deploy My Blog

on:
  push:
    branches:
      - main
  schedule:
    # https://crontab.guru/#0_10_*/7_*_*
    - cron: "0 10 */7 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    name: A job to deploy blog.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch submodule branch refs
        # actions/checkout only fetches the pinned commit for each submodule, not
        # its tracked branch (e.g. source/web -> origin/website). Without this,
        # `--remote` below fails with "Unable to find refs/remotes/origin/<branch>".
        run: git submodule foreach --recursive 'git fetch origin "+refs/heads/*:refs/remotes/origin/*"'
      - name: Update submodules to latest
        run: git submodule update --init --remote --recursive
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache node modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Gist
        run: npm run build:gist
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_USERNAME: Wxh16144
        continue-on-error: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages # deploying branch
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
