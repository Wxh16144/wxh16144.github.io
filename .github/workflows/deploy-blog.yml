# Mirrored verbatim on `posts`, `hexo` and `notes`: Actions only reads the copy on
# the branch being pushed, so this file must exist on every content branch. Keep
# it to triggers only — the deploy logic lives in deploy-site.yml on `hexo`.
name: Deploy My Blog

on:
  push:
    branches:
      - notes
  workflow_dispatch:
  schedule:
    # https://crontab.guru/#0_10_*/7_*_*
    - cron: "0 10 */7 * *"

permissions:
  contents: write

jobs:
  deploy:
    uses: Wxh16144/wxh16144.github.io/.github/workflows/deploy-site.yml@hexo
    secrets: inherit
