name: Deploy Site

# 可复用工作流，由各分支的 deploy-blog.yml 调用。
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 调用方可能是 posts，站点固定从 hexo 构建
          ref: hexo
          submodules: true
      - name: Fetch submodule branch refs
        # checkout 只取子模块的 pinned commit，不含其跟踪分支，缺这步下面 --remote 会失败
        run: git submodule foreach --recursive 'git fetch origin "+refs/heads/*:refs/remotes/origin/*"'
      - name: Update submodules to latest
        run: git submodule update --init --remote --recursive
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache node modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Gist
        run: npm run build:gist
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_USERNAME: Wxh16144
        continue-on-error: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
